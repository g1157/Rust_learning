[package]
name = "Rust_wgpu_TDGL_AI_Trial"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
wgpu = "23"
winit = "0.30"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
anyhow = "1"
rand = "0.8"
env_logger = "0.11"
log = "0.4"

# egui UI 框架 (使用最新版本支持 wgpu 23)
egui = "0.30"
egui-wgpu = "0.30"
egui-winit = "0.30"
egui_plot = "0.30"
