<!DOCTYPE html>
<html>
<head>
    <title>WebSocket Test</title>
    <style>
        body { font-family: monospace; padding: 20px; background: #1a1a1a; color: #0f0; }
        button { margin: 5px; padding: 10px; font-size: 14px; }
        #log { border: 1px solid #0f0; padding: 10px; height: 400px; overflow-y: scroll; background: #000; }
        .error { color: #f00; }
        .success { color: #0f0; }
        .info { color: #ff0; }
    </style>
</head>
<body>
    <h1>🎮 Asteroids WebSocket 测试</h1>
    <div>
        <button onclick="connect()">连接服务器</button>
        <button onclick="disconnect()">断开连接</button>
        <button onclick="sendJoinQueue()">加入队列 (Survival)</button>
        <button onclick="sendPing()">发送 Ping</button>
        <button onclick="clearLog()">清除日志</button>
    </div>
    <h3>连接日志:</h3>
    <div id="log"></div>

    <script>
        let ws = null;

        function log(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const time = new Date().toLocaleTimeString();
            logDiv.innerHTML += `<div class="${type}">[${time}] ${message}</div>`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function connect() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                log('已经连接到服务器', 'info');
                return;
            }

            log('正在连接到 ws://localhost:9001...', 'info');
            ws = new WebSocket('ws://localhost:9001');

            ws.onopen = () => {
                log('✅ WebSocket 连接成功！', 'success');
            };

            ws.onmessage = (event) => {
                log(`📨 收到消息: ${event.data}`, 'success');
                try {
                    const msg = JSON.parse(event.data);
                    log(`   类型: ${msg.type}`, 'info');
                } catch (e) {
                    log(`   (非JSON消息)`, 'info');
                }
            };

            ws.onerror = (error) => {
                log(`❌ WebSocket 错误: ${error}`, 'error');
            };

            ws.onclose = () => {
                log('🔌 WebSocket 连接已关闭', 'info');
                ws = null;
            };
        }

        function disconnect() {
            if (ws) {
                ws.close();
                log('正在断开连接...', 'info');
            } else {
                log('没有活动的连接', 'info');
            }
        }

        function sendJoinQueue() {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                log('❌ 请先连接服务器', 'error');
                return;
            }

            const message = {
                type: "JoinQueue",
                mode: "Survival",
                nickname: "TestPlayer"
            };

            ws.send(JSON.stringify(message));
            log(`📤 发送消息: ${JSON.stringify(message)}`, 'info');
        }

        function sendPing() {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                log('❌ 请先连接服务器', 'error');
                return;
            }

            const message = { type: "Ping" };
            ws.send(JSON.stringify(message));
            log(`📤 发送 Ping`, 'info');
        }

        function clearLog() {
            document.getElementById('log').innerHTML = '';
        }

        // 自动连接
        window.onload = () => {
            log('🚀 WebSocket 测试工具已就绪', 'success');
            log('点击 "连接服务器" 开始测试', 'info');
        };
    </script>
</body>
</html>
