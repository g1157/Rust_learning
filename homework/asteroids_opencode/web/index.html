<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Asteroids</title>
    <style>
        html, body, canvas {
            margin: 0px;
            padding: 0px;
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: absolute;
            background: black;
            z-index: 0;
        }
    </style>
</head>
<body>
    <canvas id="glcanvas" tabindex="1"></canvas>
    <!--
        Note: The order of scripts is important!
        1. mq_js_bundle.js: macroquad/miniquad engine. Must be first.
        2. localstorage_polyfill.js: Provides functions used by the wasm module for local storage.
        3. websocket_client.js: Provides websocket functions for the wasm module.
        4. input_handler.js: Provides custom input handling for the wasm module.
        5. The inline script that loads and runs the wasm module.
    -->
    <script src="mq_js_bundle.js?v=0.3.0"></script>
    <script src="localstorage_polyfill.js"></script>
    <script src="websocket_client.js"></script>
    <script src="input_handler.js"></script>
    <script>
        // Use the 'load' function from mq_js_bundle.js to load the wasm module
        load("asteroids_opencode.wasm?v=0.3.0").then(function(instance) {
            console.log("WASM module loaded and started.");
        }).catch(function(error) {
            console.error("Failed to load WASM module:", error);
            // Display an error message to the user on the canvas or in an alert
            var canvas = document.getElementById('glcanvas');
            var context = canvas.getContext('2d');
            context.fillStyle = 'white';
            context.font = '16px sans-serif';
            context.fillText('Error loading game.', 20, 20);
        });
    </script>
</body>
</html>
