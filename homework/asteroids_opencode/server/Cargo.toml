[package]
name = "asteroids_server"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
tokio-tungstenite = "0.21"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures-util = "0.3"
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = "0.4"
rand = "0.8"

[[bin]]
name = "server"
path = "src/main.rs"
