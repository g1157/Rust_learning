[package]
name = "asteroids_opencode"
version = "0.3.0"
edition = "2024"

[dependencies]
macroquad = "0.4.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
quad-storage = "0.1.3"
ws_stream_wasm = "0.7"
futures = "0.3"
wasm-bindgen-futures = "0.4"
lazy_static = "1.4"
web-sys = { version = "0.3", features = ["WebSocket", "MessageEvent", "ErrorEvent", "CloseEvent"] }
wasm-bindgen = "0.2"
js-sys = "0.3"

[profile.release]
opt-level = 'z'
lto = true
