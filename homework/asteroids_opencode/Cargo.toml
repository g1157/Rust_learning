[package]
name = "asteroids_opencode"
version = "0.3.0"
edition = "2021"

[dependencies]
macroquad = "0.4.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
quad-storage = "0.1.3"
lazy_static = "1.4"

# 跨平台 WebSocket 客户端（支持原生和 WASM）
ewebsock = "0.8"

# WASM 专用依赖（用于其他 WASM 功能）
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["WebSocket", "MessageEvent", "ErrorEvent", "CloseEvent"] }

[profile.release]
opt-level = 'z'
lto = true
